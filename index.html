<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Media</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="container">

        <!-- PROFILE -->
        <section class="profile">

            <div class="profile-photo">
                <img src="foto-profile.jpg" alt="Foto Profil">
            </div>

            <h1>Nama Kamu</h1>

            <p class="username">@usernamekamu</p>

            <p class="bio">
                Beauty • Lifestyle • Daily Life 🌿
                <br>
                Sharing positive vibes & beautiful moments ✨
            </p>

        </section>


        <!-- SOCIAL MEDIA -->
        <section class="social-list">

            <a href="https://instagram.com/" class="social-card instagram">
                <div class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>

                <div class="social-text">
                    <strong>Instagram</strong>
                    <span>@usernamekamu</span>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <a href="https://tiktok.com/" class="social-card tiktok">
                <div class="icon">
                    <i class="fa-brands fa-tiktok"></i>
                </div>

                <div class="social-text">
                    <strong>TikTok</strong>
                    <span>@usernamekamu</span>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <a href="https://wa.me/6281234567890" class="social-card whatsapp">
                <div class="icon">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>

                <div class="social-text">
                    <strong>WhatsApp</strong>
                    <span>Chat dengan saya</span>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <a href="#" class="social-card youtube">
                <div class="icon">
                    <i class="fa-brands fa-youtube"></i>
                </div>

                <div class="social-text">
                    <strong>YouTube</strong>
                    <span>My YouTube Channel</span>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>


            <a href="mailto:emailkamu@gmail.com" class="social-card email">
                <div class="icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="social-text">
                    <strong>Email</strong>
                    <span>emailkamu@gmail.com</span>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

        </section>


        <!-- QUOTE -->
        <div class="quote">
            <span>🌿</span>
            <p>Be kind. Be beautiful. Be yourself.</p>
            <span>✨</span>
        </div>


        <!-- FOOTER -->
        <footer>
            © 2026 Nama Kamu
        </footer>

    </main>

</body>
</html>
